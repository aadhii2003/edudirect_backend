name: Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            echo "===== Updating Backend ====="

            cd /var/www/edudirect/edudirect_backend
            git pull --ff-only origin main

            cd /var/www/edudirect

            echo "===== Rebuilding Backend ====="
            docker compose up -d --no-deps --build backend

            echo "===== Running Migrations ====="
            docker compose exec -T backend python manage.py migrate --noinput

            echo "===== Waiting for Backend ====="
            sleep 10

            echo "===== Health Check ====="

            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8001/api/auth/login/)

            echo "HTTP Status: $STATUS"

            if [ "$STATUS" = "200" ] || [ "$STATUS" = "405" ]; then
              echo "✅ Backend is healthy."
            else
              echo "❌ Backend health check failed (HTTP $STATUS)"
              docker compose logs --tail=50 backend
              exit 1
            fi

            echo "===== Cleaning Old Images ====="
            docker image prune -f

            echo "✅ Backend deployed successfully."